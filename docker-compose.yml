services:
  node:
    image: node:22
    user: node
    init: true
    environment:
      - PATH=/project/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - npm_config_cache=/tmp/npm-cache
    volumes:
      - ./:/project
    working_dir: /project
    ports:
      - "8080:8080"
